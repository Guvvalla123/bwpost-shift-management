services:
  - type: web
    name: bwpost-shift-management-backend
    env: node
    region: oregon
    plan: free
    rootDir: backEnd
    buildCommand: npm ci
    startCommand: node server.js
    # FRONTEND_URL / ALLOWED_ORIGINS: production Vercel origin. Local dev is not needed on Render.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5500
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        value: https://bwpost-shift-management.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://bwpost-shift-management.vercel.app
      - key: HEALTH_CHECK_SECRET
        sync: false
      - key: PASSWORD_RESET_EXPIRE_MS
        value: 3600000
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_USERNAME
        sync: false
